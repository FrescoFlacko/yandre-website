<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Yanique Andre, in Three Acts</title>
<meta name="description" content="A cinematic portfolio of Yanique Andre's career, from Brampton to engineering leadership at BMO, told in three acts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..900;1,6..96,400..700&family=Courier+Prime&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a film in one long reel. Title card, a pinned prologue, three acts
   (act card, then scenes with screenplay sluglines), side reels, end credits.
   One committed dark look: a screening room lit by a tungsten projector. */
:root {
  --night: #0a0c16;
  --screen: #11141f;
  --cream: #eee6d4;
  --dim: #8f8c9c;
  --tungsten: #f0b25a;
  --rule: rgba(238, 230, 212, 0.14);

  --f-title: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-script: "Courier Prime", "Courier New", Courier, monospace;

  --gutter: clamp(16px, 5vw, 72px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--night);
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 1.05rem;
  line-height: 1.6;
}
.title-card, .act { overflow-x: clip; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--tungsten); outline-offset: 4px; }
::selection { background: var(--tungsten); color: var(--night); }

.slug {
  font-family: var(--f-script);
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ---------- film grain + vignette ---------- */
#grain {
  position: fixed;
  inset: 0;
  background-size: 180px 180px;
  pointer-events: none;
  z-index: 50;
  opacity: 0.07;
  mix-blend-mode: screen;
}
.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 49;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
}

/* ---------- HUD ---------- */
.hud {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(10, 12, 22, 0.92), transparent);
  pointer-events: none;
}
.hud .slug { color: var(--cream); opacity: 0.75; }
.hud .rec::before { content: "● "; color: var(--tungsten); }
.nav {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: 0;
  z-index: 40;
  display: flex;
  gap: 18px;
  padding: 14px var(--gutter);
}
.nav a { font-family: var(--f-script); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: var(--dim); }
.nav a:hover, .nav a.on { color: var(--tungsten); }
@media (max-width: 560px) { .nav { display: none; } }

/* ---------- title card ---------- */
.title-card {
  position: relative;
  min-height: min(92svh, 900px);
  display: grid;
  align-content: center;
  gap: 18px;
  padding: 96px var(--gutter) 80px;
  isolation: isolate;
}
.title-card::before {
  /* the projector beam */
  content: "";
  position: absolute;
  inset: -20% -10% 20%;
  background: radial-gradient(ellipse 60% 55% at 70% 0%, rgba(240, 178, 90, 0.22), transparent 70%);
  z-index: -1;
}
.presents { opacity: 0; animation: fade 1.2s 0.2s ease-out forwards; }
.name {
  margin: 0;
  font-family: var(--f-title);
  font-weight: 800;
  font-size: clamp(3.6rem, 15vw, 13.5rem);
  line-height: 0.84;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.name span { display: block; }
.name span:nth-child(2) { font-style: italic; font-weight: 500; padding-left: 0.6em; color: var(--tungsten); }
.name span { animation: track 2.2s cubic-bezier(0.2, 0.7, 0.1, 1) both; }
.name span:nth-child(2) { animation-delay: 0.25s; }
.billing {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  align-items: baseline;
  opacity: 0;
  animation: fade 1.2s 1.2s ease-out forwards;
}
.billing .role { font-family: var(--f-title); font-size: clamp(1.3rem, 3vw, 2rem); font-style: italic; }
.cue { margin-top: 28px; opacity: 0; animation: fade 1s 1.8s forwards; }
.cue::after { content: " ↓"; color: var(--tungsten); }
@keyframes fade { to { opacity: 1; } }
@keyframes track { from { letter-spacing: 0.25em; opacity: 0.15; filter: blur(8px); } to { letter-spacing: -0.02em; opacity: 1; filter: blur(0); } }

/* ---------- prologue (pinned) ---------- */
.prologue { height: 260svh; position: relative; }
.prologue-stage {
  position: sticky;
  top: 0;
  height: 100svh;
  display: grid;
  align-content: center;
  gap: 18px;
  padding: 0 var(--gutter);
}
.prologue p {
  margin: 0;
  max-width: 22ch;
  font-family: var(--f-title);
  font-size: clamp(1.8rem, 5.2vw, 4.2rem);
  line-height: 1.08;
  opacity: 0.16;
  transform: translateY(8px);
  transition: opacity 0.6s, transform 0.6s, color 0.6s;
}
.prologue p.on { opacity: 1; transform: none; }
.prologue p.past { opacity: 0.4; }
.prologue p:first-of-type { font-style: italic; color: var(--tungsten); }

/* ---------- act cards ---------- */
.act { padding: 0 var(--gutter); }
.act-card {
  min-height: 80svh;
  display: grid;
  align-content: center;
  gap: 14px;
  border-top: 1px solid var(--rule);
  padding: 96px 0 64px;
  position: relative;
}
.numeral {
  font-family: var(--f-title);
  font-weight: 800;
  font-size: clamp(8rem, 34vw, 30rem);
  line-height: 0.75;
  color: transparent;
  -webkit-text-stroke: 1px rgba(240, 178, 90, 0.45);
  position: absolute;
  right: -0.04em;
  top: 50%;
  transform: translateY(-50%);
  z-index: 0;
  pointer-events: none;
  user-select: none;
}
.act-card > :not(.numeral) { position: relative; z-index: 1; }
.act-card h2 {
  margin: 0;
  font-family: var(--f-title);
  font-weight: 700;
  font-size: clamp(3rem, 10vw, 8.5rem);
  line-height: 0.9;
  letter-spacing: -0.02em;
}
.act-card .logline { margin: 8px 0 0; max-width: 34ch; font-size: clamp(1.15rem, 2.2vw, 1.5rem); line-height: 1.4; color: var(--cream); opacity: 0.85; }

/* ---------- scenes ---------- */
.scenes { display: grid; gap: 0; padding-bottom: 64px; }
.scene {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px 48px;
  padding: 40px 0;
  border-top: 1px solid var(--rule);
}
@media (min-width: 820px) {
  .scene { grid-template-columns: 240px minmax(0, 1fr); }
  .scene .slug { position: sticky; top: 72px; align-self: start; }
}
.scene-body { min-width: 0; display: grid; gap: 8px; }
.scene h3 {
  margin: 0;
  font-family: var(--f-title);
  font-weight: 600;
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1;
  text-wrap: balance;
}
.scene .sub { margin: 0; color: var(--tungsten); font-size: 1rem; letter-spacing: 0.02em; }
.scene ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 62ch; }
.scene li { padding-left: 22px; position: relative; }
.scene li::before { content: "—"; position: absolute; left: 0; color: var(--dim); }

/* ---------- stats ---------- */
.stats {
  display: grid;
  grid-template-columns: 1fr;
  border-top: 1px solid var(--rule);
  margin-bottom: 64px;
}
@media (min-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 36px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; min-width: 0; }
@media (min-width: 720px) { .stat:nth-child(odd) { padding-right: 32px; border-right: 1px solid var(--rule); } .stat:nth-child(even) { padding-left: 32px; } }
.stat .num {
  font-family: var(--f-title);
  font-weight: 800;
  font-size: clamp(4.5rem, 12vw, 9rem);
  line-height: 0.9;
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--tungsten);
}
.stat p { margin: 0; max-width: 34ch; }

/* ---------- epigraph ---------- */
.epigraph { margin: 0; padding: 72px 0; border-top: 1px solid var(--rule); max-width: 28ch; }
.epigraph p { margin: 0; font-family: var(--f-title); font-style: italic; font-size: clamp(2rem, 5vw, 3.8rem); line-height: 1.1; }
.epigraph cite { display: block; margin-top: 18px; font-style: normal; }

/* ---------- reels ---------- */
.reels { padding: 0 var(--gutter) 64px; }
.reels-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 28px; }
@media (min-width: 900px) { .reels-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.reel {
  background: var(--screen);
  border: 1px solid var(--rule);
  padding: 28px 24px 24px;
  display: grid;
  gap: 10px;
  align-content: start;
  position: relative;
  transition: border-color 0.3s, transform 0.3s;
}
.reel::before, .reel::after {
  /* sprocket holes along the film edge */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 8px;
  background: radial-gradient(circle, var(--night) 2.5px, transparent 3px) 0 0 / 18px 8px repeat-x;
}
.reel::before { top: 6px; }
.reel::after { bottom: 6px; }
.reel:hover { border-color: var(--tungsten); transform: translateY(-4px); }
.reel h3 { margin: 0; font-family: var(--f-title); font-size: 2.2rem; line-height: 1; }
.reel .sub { margin: 0; color: var(--tungsten); font-size: 0.95rem; }
.reel p { margin: 0; }
.section-title { margin: 0; font-family: var(--f-title); font-size: clamp(2.4rem, 7vw, 5rem); line-height: 0.95; }
.reels-head { border-top: 1px solid var(--rule); padding-top: 96px; display: grid; gap: 10px; }

/* ---------- credits ---------- */
.credits {
  padding: 120px var(--gutter) 160px;
  text-align: center;
  display: grid;
  gap: 56px;
  justify-items: center;
  border-top: 1px solid var(--rule);
}
.credit { display: grid; gap: 10px; }
.credit .names { font-family: var(--f-title); font-size: clamp(1.4rem, 3.4vw, 2.2rem); line-height: 1.3; max-width: 30ch; text-wrap: balance; }
.credit:first-child .names { font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 700; }
.fin { font-family: var(--f-title); font-style: italic; font-size: clamp(3rem, 9vw, 6rem); color: var(--tungsten); margin: 0; }
.contact { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; }
.contact a { font-family: var(--f-script); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--tungsten); padding-bottom: 2px; }
.contact a:hover { color: var(--tungsten); }

/* ---------- scroll-driven reveals (progressive; content is visible without them) ---------- */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% cover 28%; }
    .numeral { animation: drift linear both; animation-timeline: view(); animation-range: cover 0% cover 100%; }
    .act-card h2 { animation: widen linear both; animation-timeline: view(); animation-range: entry 10% cover 40%; }
  }
}
@keyframes rise { from { opacity: 0.2; transform: translateY(48px); } to { opacity: 1; transform: none; } }
@keyframes drift { from { transform: translateY(-30%); } to { transform: translateY(-70%); } }
@keyframes widen { from { letter-spacing: 0.12em; opacity: 0.3; } to { letter-spacing: -0.02em; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .presents, .billing, .cue { animation: none; opacity: 1; }
  .name span { animation: none; }
  .prologue p { transition: none; }
  .reel { transition: none; }
}

</style>

<div id="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<nav class="nav" aria-label="Acts" id="nav"></nav>

<header class="title-card" id="top">
  <span class="slug presents">A Brampton production</span>
  <h1 class="name" id="name"></h1>
  <div class="billing">
    <span class="role" id="role"></span>
    <span class="slug" id="where"></span>
  </div>
  <span class="slug cue">Scroll to roll film</span>
</header>

<section class="prologue" id="prologue" aria-label="Prologue">
  <div class="prologue-stage" id="prologue-stage">
    <span class="slug">Prologue</span>
  </div>
</section>

<main id="acts"></main>

<section class="reels" id="reels" aria-labelledby="reels-h">
  <div class="reels-head">
    <span class="slug">Also screening · side projects</span>
    <h2 class="section-title" id="reels-h">Short films</h2>
  </div>
  <div class="reels-grid" id="reels-grid"></div>
</section>

<footer class="credits" id="credits" aria-label="Credits"></footer>

<div class="hud" aria-hidden="true">
  <span class="slug rec" id="hud-act">Title</span>
  <span class="slug" id="hud-when"></span>
</div>

<script>

<script>
(function () {
  "use strict";
  const F = window.FILM;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- title card ----------
  const [first, ...rest] = F.name.split(" ");
  $("name").innerHTML = "<span>" + esc(first) + "</span><span>" + esc(rest.join(" ")) + "</span>";
  $("role").textContent = F.role + ", " + F.company;
  $("where").textContent = F.location;

  // ---------- nav ----------
  $("nav").innerHTML =
    F.acts.map((a) => '<a href="#' + a.id + '" data-id="' + a.id + '">' + a.num + "</a>").join("") +
    '<a href="#reels" data-id="reels">Shorts</a><a href="#credits" data-id="credits">Credits</a>';

  // ---------- prologue ----------
  const stage = $("prologue-stage");
  const lines = F.coldOpen.map((t) => {
    const p = document.createElement("p");
    p.textContent = t;
    stage.appendChild(p);
    return p;
  });
  lines[0].classList.add("on");
  const prologue = $("prologue");
  function prologueStep() {
    const r = prologue.getBoundingClientRect();
    const span = prologue.offsetHeight - innerHeight;
    const t = Math.min(0.999, Math.max(0, -r.top / Math.max(1, span)));
    const idx = Math.floor(t * lines.length);
    lines.forEach((p, i) => { p.classList.toggle("on", i === idx); p.classList.toggle("past", i < idx); });
  }

  // ---------- acts ----------
  const acts = $("acts");
  let sceneNo = 0;
  F.acts.forEach((a) => {
    const sec = document.createElement("section");
    sec.className = "act";
    sec.id = a.id;
    sec.dataset.hud = "Act " + a.num + " · " + a.title;
    sec.setAttribute("aria-labelledby", a.id + "-h");
    let html =
      '<div class="act-card"><span class="numeral" aria-hidden="true">' + a.num + "</span>" +
      '<span class="slug">Act ' + a.num + " · " + esc(a.years) + "</span>" +
      '<h2 id="' + a.id + '-h">' + esc(a.title) + "</h2>" +
      '<p class="logline">' + esc(a.logline) + "</p></div>";
    if (a.id === "lead" && F.quote) {
      html += '<blockquote class="epigraph reveal"><p>' + esc(F.quote.text) + '</p><cite class="slug">' + esc(F.quote.by) + "</cite></blockquote>";
    }
    html += '<div class="scenes">' + a.scenes.map((s) => {
      sceneNo++;
      return '<article class="scene reveal" data-when="' + esc(s.when) + '">' +
        '<span class="slug">Scene ' + sceneNo + "<br>" + esc(s.when) + "</span>" +
        '<div class="scene-body"><h3>' + esc(s.title) + '</h3><p class="sub">' + esc(s.sub) + "</p>" +
        "<ul>" + s.lines.map((l) => "<li>" + esc(l) + "</li>").join("") + "</ul></div></article>";
    }).join("") + "</div>";
    if (a.stats) {
      html += '<div class="stats">' + a.stats.map((s) =>
        '<div class="stat reveal"><span class="num" data-to="' + s.value + '" data-pre="' + esc(s.prefix || "") + '" data-suf="' + esc(s.suffix || "") + '">' +
        esc((s.prefix || "") + s.value + (s.suffix || "")) + "</span><p>" + esc(s.label) + "</p></div>"
      ).join("") + "</div>";
    }
    sec.innerHTML = html;
    acts.appendChild(sec);
  });

  // ---------- reels ----------
  $("reels").dataset.hud = "Short films";
  $("reels-grid").innerHTML = F.reels.map((r) =>
    '<article class="reel reveal" data-when="' + esc(r.when) + '"><span class="slug">' + esc(r.when) + "</span><h3>" + esc(r.title) +
    '</h3><p class="sub">' + esc(r.sub) + "</p><p>" + esc(r.line) + "</p></article>"
  ).join("");

  // ---------- credits ----------
  $("credits").dataset.hud = "End credits";
  $("credits").innerHTML =
    F.credits.map((c) => '<div class="credit"><span class="slug">' + esc(c.role) + '</span><div class="names">' + c.names.map(esc).join(" · ") + "</div></div>").join("") +
    '<p class="fin">Fin.</p><p class="slug">To be continued</p>' +
    '<div class="contact"><a href="' + esc(F.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a><a href="' + esc(F.github) + '" target="_blank" rel="noopener">GitHub</a></div>';

  // ---------- HUD: current act and scene date ----------
  const hudAct = $("hud-act"), hudWhen = $("hud-when");
  const navLinks = [...document.querySelectorAll("#nav a")];
  const sections = [$("top"), $("prologue"), ...document.querySelectorAll(".act"), $("reels"), $("credits")];
  $("top").dataset.hud = "Title";
  $("prologue").dataset.hud = "Prologue";
  const dated = [...document.querySelectorAll("[data-when]")];
  function hudStep() {
    const mid = innerHeight * 0.5;
    let cur = sections[0];
    sections.forEach((s) => { if (s.getBoundingClientRect().top < mid) cur = s; });
    hudAct.textContent = cur.dataset.hud;
    navLinks.forEach((a) => a.classList.toggle("on", a.dataset.id === cur.id));
    let when = "";
    dated.forEach((d) => { const r = d.getBoundingClientRect(); if (r.top < mid && r.bottom > 0) when = d.dataset.when; });
    hudWhen.textContent = when;
  }

  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { prologueStep(); hudStep(); ticking = false; });
  }, { passive: true });
  addEventListener("resize", () => { prologueStep(); hudStep(); });
  prologueStep();
  hudStep();

  // ---------- stat count-up (final value is already in the markup) ----------
  if (!reduced && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        const el = e.target, to = +el.dataset.to, t0 = performance.now(), dur = 1400;
        const frame = (t) => {
          const k = Math.min(1, (t - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
          el.textContent = el.dataset.pre + v + el.dataset.suf;
          if (k < 1) requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      });
    }, { threshold: 0.6 });
    document.querySelectorAll(".stat .num").forEach((n) => io.observe(n));
  }

  // ---------- film grain: a few noise tiles, cycled as a background ----------
  const grainEl = $("grain");
  const tiles = [];
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), G = 180;
  cv.width = cv.height = G;
  for (let n = 0; n < (reduced ? 1 : 4); n++) {
    const img = ctx.createImageData(G, G), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
    tiles.push('url("' + cv.toDataURL() + '")');
  }
  grainEl.style.backgroundImage = tiles[0];
  if (!reduced) {
    let f = 0;
    setInterval(() => { if (!document.hidden) grainEl.style.backgroundImage = tiles[++f % tiles.length]; }, 90);
  }
})();

</script>

</body>
</html>
